name: Build

on:
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      # The browser tests (nav, contact form, lightbox, …) drive Chromium.
      - run: npx playwright install --with-deps chromium
      # CI is set by GitHub Actions, so a test that needs dist/ fails rather than skips.
      - run: npm test
